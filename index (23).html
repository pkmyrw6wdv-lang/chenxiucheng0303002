.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.month{font-weight:850;font-size:13px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%;min-width:0}.wk{text-align:center;color:var(--sub);font-size:11px;font-weight:800}.day{position:relative;aspect-ratio:1/1;min-width:0;padding:1px;background:#F7F8FA;color:#333447;border:1px solid transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05}.day.blank{background:transparent;cursor:default}.day.today{border-color:rgba(59,108,244,.45)}.day.sel{background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(59,108,244,.24)}.day.locked{background:#E5E7EB;color:#9CA3AF;border-color:#D1D5DB;box-shadow:none}.day.other{color:#fff;border-color:transparent}.day.n-1{background:#64748B}.day.n0{background:#F97316}.day.n1{background:#EF4444}.day.n2{background:#EC4899}.day.n3{background:#8B5CF6}.day.n4{background:#3B82F6}.day.n5{background:#06B6D4}.day.n6{background:#10B981}.day.n7{background:#84CC16}.day.mine-lock{background:#DBEAFE;color:#1D4ED8;border-color:#93C5FD}.day .num{font-weight:800;font-size:11px}.day .owner{font-size:6.5px;transform:scale(.92);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.day.past .owner{color:#9CA3AF}.day.other .owner{color:rgba(255,255,255,.95)}.day.mine-lock .owner,.day.sel .owner{color:inherit}
.tags{display:flex;flex-wrap:wrap;gap:5px;min-height:29px;padding:5px;border:1px dashed #C0C2CF;border-radius:13px;background:#fff}.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--p2);font-size:12px;font-weight:800}.tag.other{background:#FEE2E2;color:#991B1B}.tag button{min-height:18px;width:18px;height:18px;padding:0;border-radius:50%;background:#dbe7ff;color:var(--p2)}.sum{display:grid;gap:8px;margin-top:10px;padding:12px;border-radius:13px;background:#F7F8FA;color:#4B4D63}.sum b{color:var(--text)}.stats-card{margin-top:9px}.month-stat{margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.07)}.month-stat:first-child{margin-top:0}.stat-head{display:flex;justify-content:space-between;gap:7px;align-items:center;margin:-2px -2px 10px;padding:7px 10px;border-radius:13px;background:linear-gradient(135deg,#F8FAFF,#EEF4FF);box-shadow:inset 0 0 0 1px rgba(59,108,244,.08);font-weight:900}.stat-head small{color:var(--sub);font-weight:600;font-size:11px}.stat-table{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:12px}.stat-table th,.stat-table td{padding:6px 7px;text-align:right;background:#FBFCFF}.stat-table tbody tr{box-shadow:0 2px 8px rgba(15,23,42,.04)}.stat-table tbody td:first-child{border-radius:10px 0 0 10px}.stat-table tbody td:last-child{border-radius:0 10px 10px 0}.stat-table th:first-child,.stat-table td:first-child{text-align:left}.stat-table th{color:var(--sub);font-weight:800;background:transparent;padding-top:4px;padding-bottom:4px}.money.plus{color:#B42318;font-weight:900}.money.minus{color:#047857;font-weight:900}.money.zero{color:var(--sub);font-weight:900}.stat-note{margin-top:5px;color:var(--sub);font-size:10px;line-height:1.36}.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);max-width:calc(100vw - 28px);padding:10px 14px;border-radius:999px;background:rgba(26,26,46,.92);color:#fff;opacity:0;transition:.18s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.42);z-index:10;padding:0}.modal.show{display:flex}.modal-card{width:min(480px,100%);max-height:58vh;overflow:auto;padding:18px;border-radius:22px 22px 0 0;background:#fff;box-shadow:0 -20px 60px rgba(0,0,0,.25)}.modal-card h3{margin:0 0 8px;font-size:18px}.modal-card p{margin:0 0 12px;color:var(--sub);font-size:13px}.modal-card input,.modal-card textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}.modal-card textarea{min-height:120px;resize:vertical}.month-note{margin-top:9px;padding:7px;border-radius:12px;background:#F7F8FA;color:#4B4D63;font-size:12px;line-height:1.55}.month-note b{color:var(--text)}.note-btn{min-height:30px;padding:0 9px;border-radius:999px;background:var(--soft);color:var(--p2);font-size:12px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stats-card{margin-top:14px}.month-stat{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.month-stat:first-child{margin-top:0}.stat-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-weight:900}.stat-head small{color:var(--sub);font-weight:500}.stat-subtitle{margin:13px 0 6px;padding:6px 9px;border-radius:10px;background:#F3F6FB;font-size:13px;font-weight:900;color:#243B6B}.stat-table{width:100%;border-collapse:collapse;font-size:12px}.stat-table th,.stat-table td{padding:7px 6px;border-bottom:1px solid #EEF0F4;text-align:right}.stat-table th:first-child,.stat-table td:first-child{text-align:left}.stat-table th{color:var(--sub);font-weight:800}.money.salary{color:#B42318;font-weight:900}.money.pay-default{color:#047857;font-weight:900}.money.pay-low{color:#0891B2;font-weight:900}.money.pay-mid{color:#7C3AED;font-weight:900}.money.pay-high{color:#DC2626;font-weight:900}.money.pay-pos{color:#047857;font-weight:900}.money.zero{color:var(--sub);font-weight:900}.stat-note{margin-top:8px;color:var(--sub);font-size:11px;line-height:1.5}.foot{text-align:center;color:var(--sub);font-size:12px;margin:14px 0 0}
@media(max-width:430px){.actions{grid-template-columns:1fr 1fr}.sec{padding:7px 8px}h1{font-size:20px}.app{padding-left:6px;padding-right:6px}.day .num{font-size:12px}.day .owner{font-size:7px}}

<body>
<main class="app"><header class="hero"><h1>值班登记表</h1></header>
<div class="main-tabs"><button class="main-tab active" id="tabDutyBtn">值班登记</button><button class="main-tab" id="tabStatsBtn">值班与工资统计</button></div><div class="tab-panel" id="tabDuty"><section class="card"><div class="sec compact-info"><div class="inline-field"><label>姓名</label><select id="name"><option value="">请选择姓名</option><option value="-1">-1管理员机动</option><option value="0">0-合</option><option value="1">1-花</option><option value="2">2-丽</option><option value="3">3-铃</option><option value="4">4-菊</option><option value="5">5-凤</option><option value="6">6-莲</option><option value="7">7-成</option></select></div><span class="hint hidden-hint" id="draft">未保存</span></div>
<div class="sec date-sec"><h2 class="title compact-title">选择值班日期<span class="hint" id="modeHint">新增模式</span></h2><div class="cal-head"><button class="ghost" id="prev">上月</button><div class="month" id="month"></div><button class="ghost" id="next">下月</button></div><div class="grid" id="cal"></div><p class="note">蓝色=自己已保存信息，本账号已保存信息在“编辑历史已提交”模式下可修改；</p><div class="field"><label>当前姓名已选日期</label><div class="tags" id="tags"></div></div><div class="actions compact-actions"><button class="btn2" id="save">保存</button><button class="btn" id="submit">提交</button><button class="ghost subtle-edit" id="edit">编辑历史已提交</button></div></div></section></div><div class="tab-panel hidden-panel" id="tabStats"><section class="card stats-card"><div class="sec"><h2 class="title">按月值班与工资统计<span class="hint">仅统计已提交记录</span></h2><div id="stats"></div></div></section></div><p class="foot">数据保存在 Supabase 云端。</p></main><div class="toast" id="toast"></div><div class="modal" id="noteModal"><div class="modal-card"><h3 id="noteTitle">月度备注</h3><p>备注按月份保存，展示在工资和支付统计下方。</p><textarea id="monthNoteInput" placeholder="请输入本月备注"></textarea><div class="modal-actions"><button class="ghost" id="noteCancel">取消</button><button class="btn" id="noteSave">保存备注</button></div></div></div><div class="modal" id="passModal"><div class="modal-card"><h3>输入编辑口令</h3><p>查看数据和点选日期不需要口令；保存、提交、编辑历史已提交需要口令。</p><input id="passInput" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="请输入口令"><div class="modal-actions"><button class="ghost" id="passCancel">取消</button><button class="btn" id="passOk">确认</button></div></div></div>
<script>
const NAMES=['-1','0','1','2','3','4','5','6','7'];
const PAY_NAMES=['1','2','3','4','5','6','7'];
const NAME_LABELS={'-1':'-1管理员机动',0:'0-合',1:'1-花',2:'2-丽',3:'3-铃',4:'4-菊',5:'5-凤',6:'6-莲',7:'7-成'};
const EDIT_PASS='33673472';
const SUPABASE_URL='https://ltdyppfomthxiprfmxbq.supabase.co';
const SUPABASE_KEY='sb_publishable_XH7DOUhidJvnt3ELX1pkFg_r5py5EEw';
const TABLE='duty_records',NOTE_TABLE='duty_month_notes',NK='duty-h5-name-v4',EDIT_START='2026-08-10';
const $=id=>document.getElementById(id);
let month=new Date(),sel=new Set(),allRows=[],monthNotes=[],submitted=false,currentName='',editMode=false,editAuthed=sessionStorage.getItem('duty-edit-auth')==='1',passResolve=null,baseline='',editingNoteMonth='';month.setDate(1);
function pad(n){return String(n).padStart(2,'0')}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function fmt(s){let a=s.split('-');return(+a[1])+'月'+(+a[2])+'日'}function msg(x){let n=$('toast');n.textContent=x;n.classList.add('show');clearTimeout(n.t);n.t=setTimeout(()=>n.classList.remove('show'),2500)}
function askPass(){return new Promise(resolve=>{passResolve=resolve;$('passInput').value='';$('passModal').classList.add('show');setTimeout(()=>$('passInput').focus(),30)})}
async function ensureEditAuth(){if(editAuthed)return true;let ok=await askPass();return ok}
function passDone(ok){if(ok&&$('passInput').value!==EDIT_PASS){msg('口令不正确');$('passInput').focus();return}if(ok){editAuthed=true;sessionStorage.setItem('duty-edit-auth','1')} $('passModal').classList.remove('show');let r=!!ok;if(passResolve){passResolve(r);passResolve=null}}
function getSavedName(){try{return localStorage.getItem(NK)||sessionStorage.getItem(NK)||''}catch(e){return sessionStorage.getItem(NK)||''}}function setSavedName(n){try{localStorage.setItem(NK,n)}catch(e){}try{sessionStorage.setItem(NK,n)}catch(e){}}function clearSavedName(){try{clearSavedName()}catch(e){}try{sessionStorage.removeItem(NK)}catch(e){}}function ownerClass(names){if(!names||!names.length)return'';let n=names[0];return ' n'+String(n).replace('-','-')}function today(){return iso(new Date())}function labelOf(n){return NAME_LABELS[n]||n||'未选择'}function api(p){return SUPABASE_URL+'/rest/v1/'+p}function h(extra){return Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},extra||{})}
async function req(p,opt){let r=await fetch(api(p),Object.assign({},opt||{},{headers:h((opt&&opt.headers)||{})}));let t=await r.text(),j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}if(!r.ok)throw new Error((j&&j.message)||t||'请求失败');return j}
function fromCloud(r){return{name:r.name,dates:r.dates||[],submitted:!!r.submitted,updatedAt:r.updated_at}}
async function loadAll(){allRows=await req(TABLE+'?select=name,dates,submitted,updated_at&order=name.asc');try{monthNotes=await req(NOTE_TABLE+'?select=month,note,updated_at&order=month.asc')}catch(e){monthNotes=[]}return allRows}
function rowOf(n){return allRows.find(r=>r.name===n)}function occupiedMap(){let m={};allRows.forEach(r=>{(r.dates||[]).forEach(d=>{if(!m[d])m[d]=[];m[d].push(r.name)})});return m}function otherDates(){let s=new Set();allRows.forEach(r=>{if(r.name!==currentName)(r.dates||[]).forEach(d=>s.add(d))});return s}
async function loadName(n){currentName=n;setSavedName(n);await loadAll();let r=rowOf(n);setData(r?fromCloud(r):{name:n});editMode=false;render();msg('已切换到：'+labelOf(n))}
function data(){return{name:currentName,dates:[...sel].sort(),submitted,updatedAt:new Date().toISOString()}}function snapshot(){let d=data();return JSON.stringify({name:d.name,dates:d.dates,submitted:d.submitted})}function hasChanged(){return snapshot()!==baseline}
function setData(d){$('name').value=d.name||currentName||'';currentName=$('name').value;sel=new Set(d.dates||[]);submitted=!!d.submitted;baseline=snapshot();state(d.updatedAt)}
function state(ts,override){let s=override||(currentName?(editMode?'编辑模式':submitted?'已提交':'未提交'):'请选择姓名');$('draft').textContent=s;$('modeHint').textContent=editMode?'编辑模式':'新增模式';$('edit').textContent=editMode?'退出编辑':'编辑历史已提交'}
async function saveCloud(silent){if(!currentName)return msg('请先选择姓名');if(!hasChanged())return msg('未变更内容无需重复保存');if(!(await ensureEditAuth()))return;let d=data();state(d.updatedAt,'同步中...');try{let body={name:d.name,dept:'',duty_type:'',remark:'',dates:d.dates,submitted:d.submitted,updated_at:new Date().toISOString()};let rows=await req(TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});await loadAll();if(rows&&rows[0])setData(fromCloud(rows[0]));baseline=snapshot();render();if(!silent)msg('已保存到云端')}catch(e){msg('保存失败：'+e.message);state()}}
function render(){renderCal();renderTags();renderSum();renderStats();state()}
function canClick(s,isMine,isOther,isPast){
  if(!currentName)return false;
  if(isOther)return false;
  if(s<EDIT_START)return false;
  if(isMine&&!submitted)return true;
  if(isMine)return editMode;
  if(isPast)return editMode;
  return true;
}
function renderCal(){let c=$('cal');c.innerHTML='';let y=month.getFullYear(),m=month.getMonth(),td=today(),od=otherDates(),om=occupiedMap();$('month').textContent=y+'年'+(m+1)+'月';['日','一','二','三','四','五','六'].forEach(w=>{let e=document.createElement('div');e.className='wk';e.textContent=w;c.appendChild(e)});let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let b=document.createElement('button');b.className='day blank';b.disabled=true;c.appendChild(b)}for(let d=1;d<=days;d++){let s=iso(new Date(y,m,d)),mine=sel.has(s),other=od.has(s),past=s<td,b=document.createElement('button');let owners=(om[s]||[]).map(labelOf).join('、');let ok=canClick(s,mine,other,past);b.type='button';b.innerHTML='<span class="num">'+d+'</span><span class="owner">'+(owners||(s<EDIT_START?'不可改':past?(editMode?'可编辑':'历史'):''))+'</span>';b.title=owners?'预占：'+owners:(s<EDIT_START?'早于可编辑起点':'可选择');b.className='day'+(s===td?' today':'')+(mine?' sel':'')+(past?' past':'')+(other?' other':'')+(other?ownerClass(om[s]):'')+(mine&&!editMode?' mine-lock':'')+(!ok?' locked':'');b.disabled=!ok;b.onclick=()=>toggle(s);c.appendChild(b)}}
function toggle(s){if(sel.has(s))sel.delete(s);else sel.add(s);submitted=false;render()}
function renderTags(){let b=$('tags'),arr=[...sel].sort();b.innerHTML='';if(!currentName){b.innerHTML='<span class="hint">请先选择姓名</span>';return}if(!arr.length){b.innerHTML='<span class="hint">暂未选择日期</span>';return}arr.forEach(s=>{let t=document.createElement('span');t.className='tag';t.innerHTML=fmt(s)+(editMode?' <button type="button">×</button>':'');if(editMode)t.querySelector('button').onclick=()=>toggle(s);b.appendChild(t)})}
function renderSum(){}
function renderStats(){
  let box=$('stats');if(!box)return;
  let rows=allRows.map(r=>({name:r.name,dates:r.dates||[],submitted:!!r.submitted}));
  let d=data();
  if(d.name){rows=rows.filter(r=>r.name!==d.name);if(d.submitted)rows.push({name:d.name,dates:d.dates,submitted:true})}
  rows=rows.filter(r=>r.submitted);
  let months=new Set();rows.forEach(r=>(r.dates||[]).forEach(x=>months.add(x.slice(0,7))));months.add(month.getFullYear()+'-'+pad(month.getMonth()+1));
  let sorted=[...months].sort();box.innerHTML=sorted.map(mon=>renderMonthStat(mon,rows)).join('');
}
function countFor(rows,name,mon){let r=rows.find(x=>x.name===name);return r?(r.dates||[]).filter(x=>x.startsWith(mon+'-')).length:0}
function renderMonthStat(mon,rows){
  let y=+mon.slice(0,4),m=+mon.slice(5,7),daysInMonth=new Date(y,m,0).getDate();
  let currentMon=today().slice(0,7),todayDay=+today().slice(8,10);
  let cutoff=mon<currentMon?daysInMonth:(mon===currentMon?todayDay:0);
  let counts={};NAMES.forEach(n=>counts[n]=countFor(rows,n,mon));
  let currentCounts={};NAMES.forEach(n=>currentCounts[n]=countForUntil(rows,n,mon,cutoff));
  let total=NAMES.reduce((a,n)=>a+(counts[n]||0),0);
  let currentTotal=NAMES.reduce((a,n)=>a+(currentCounts[n]||0),0);
  let current0Days=currentCounts['0']||0;
  let monthEndNon0Days=NAMES.filter(n=>n!=='0').reduce((a,n)=>a+(counts[n]||0),0);
  let currentWage0=4000+(current0Days-(daysInMonth-4))*150;
  let monthEndWage0=4600-monthEndNon0Days*150;
  let maxPay=Math.ceil(4600/7);
  let adminDays=counts['-1']||0, currentAdminDays=currentCounts['-1']||0;
  let adminShare=adminDays*150/7, currentAdminShare=currentAdminDays*150/7;
  let base=4600/7, currentBase=base*(cutoff/daysInMonth);
  let payRows=PAY_NAMES.map(n=>{
    let currentPay=-(currentBase-(currentCounts[n]||0)*150-currentAdminShare);
    let monthPay=-(base-(counts[n]||0)*150-adminShare);
    return {name:n,count:counts[n]||0,currentCount:currentCounts[n]||0,currentPay,monthPay};
  }).sort((a,b)=>b.monthPay-a.monthPay);
  let totalForRatio=total||1;
  let table0='<table class="stat-table"><thead><tr><th>人员</th><th>天数</th><th>比例</th><th>当前工资</th><th>月底工资</th></tr></thead><tbody><tr><td>'+labelOf('0')+'</td><td>'+counts['0']+'</td><td>'+ratio(counts['0'],totalForRatio)+'</td><td class="money salary">'+money(currentWage0)+'</td><td class="money salary">'+money(monthEndWage0)+'</td></tr></tbody></table>';
  let admin='<tr><td>'+labelOf('-1')+'</td><td>'+adminDays+'</td><td>'+ratio(adminDays,totalForRatio)+'</td><td>—</td><td>—</td></tr>';
  let payerRows=payRows.map(r=>'<tr><td>'+labelOf(r.name)+'</td><td>'+r.count+'</td><td>'+ratio(r.count,totalForRatio)+'</td><td class="money '+payClass(r.currentPay)+'">'+money(r.currentPay)+'</td><td class="money '+payClass(r.monthPay)+'">'+money(r.monthPay)+'</td></tr>').join('');
  let note=getMonthNote(mon);
  return '<div class="month-stat"><div class="stat-head"><span>'+y+'年'+m+'月</span><small>截止到 '+today()+'</small></div><div class="stat-subtitle">0-合正式员工工资（最大工资 ¥4600）</div>'+table0+'<div class="stat-subtitle">-1管理员机动 / 1花-7成支付统计（最大支付 ¥'+maxPay+'）</div><table class="stat-table"><thead><tr><th>人员</th><th>天数</th><th>比例</th><th>当前需付</th><th>月底需付</th></tr></thead><tbody>'+admin+payerRows+'</tbody></table><div class="month-note"><b>月度备注：</b>'+(note||'暂无')+'<br><button class="note-btn" onclick="openNote(\''+mon+'\')">编辑本月备注</button></div><div class="stat-note">计算规则：当前工资 = 4000 + (当前已发生0值班天数 - (本月天数-4)) × 150；月底工资 = 4600 - 本月已发生和已标记的非“0-合”日期数 × 150。当前需付按 YYYY-MM-DD 至今天的已发生日期计算；月底需付按本月已选择的全部日期估算。“1花-7成”支付金额以支出为负数：当前/月底基数 - 本人值班天数×150 - 管理员机动天数×150/7，再取负数展示。“-1管理员机动”只展示天数和比例，不展示金额。</div></div>';
}
function countForUntil(rows,name,mon,cutoff){
  if(cutoff<=0)return 0;
  let r=rows.find(x=>x.name===name);
  if(!r)return 0;
  return (r.dates||[]).filter(x=>x.startsWith(mon+'-') && (+x.slice(8,10))<=cutoff).length;
}
function getMonthNote(mon){let r=monthNotes.find(x=>x.month===mon);return r&&r.note?r.note:''}
async function openNote(mon){if(!(await ensureEditAuth()))return;editingNoteMonth=mon;$('noteTitle').textContent=mon+' 月度备注';$('monthNoteInput').value=getMonthNote(mon);$('noteModal').classList.add('show');setTimeout(()=>$('monthNoteInput').focus(),30)}
function closeNote(){$('noteModal').classList.remove('show');editingNoteMonth=''}
async function saveMonthNote(){if(!editingNoteMonth)return;let note=$('monthNoteInput').value.trim();try{await req(NOTE_TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({month:editingNoteMonth,note:note,updated_at:new Date().toISOString()})});await loadAll();closeNote();renderStats();msg('月度备注已保存')}catch(e){msg('备注保存失败：'+e.message)}}
function ratio(x,total){return total?((x/total)*100).toFixed(1)+'%':'0.0%'}
function money(x){let sign=x<0?'-':x>0?'+':'';let v=Math.abs(x);let n=Math.round(v*100)/100;return sign+'¥'+n.toFixed(Number.isInteger(n)?0:2)}
function moneyClass(x){return x>0?'salary':x<0?'pay-default':'zero'}function payClass(x){let v=Math.abs(x);if(v===0)return'zero';if(v<300)return'pay-low';if(v<600)return'pay-default';if(v<900)return'pay-mid';return'pay-high'}function switchMainTab(which){let duty=which==='duty';$('tabDuty').classList.toggle('hidden-panel',!duty);$('tabStats').classList.toggle('hidden-panel',duty);$('tabDutyBtn').classList.toggle('active',duty);$('tabStatsBtn').classList.toggle('active',!duty);if(!duty)renderStats()}
function check(){if(!currentName)return'请先选择姓名';return''}
async function submit(){let e=check();if(e)return msg(e);if(submitted&&!hasChanged())return msg('未变更内容无需重复保存');if(!(await ensureEditAuth()))return;submitted=sel.size>0;await saveCloud(true);editMode=false;render();msg(sel.size?'已提交到云端':'已清空日期并同步到云端')}
async function clearCurrent(){if(!currentName)return msg('请先选择姓名');if(!confirm('确认清空当前姓名的所有已选日期？'))return;sel.clear();submitted=false;await saveCloud(true);render();msg('已清空并同步')}
$('tabDutyBtn').onclick=()=>switchMainTab('duty');$('tabStatsBtn').onclick=()=>switchMainTab('stats');$('name').onchange=async()=>{let n=$('name').value;if(!n){currentName='';sel.clear();render();localStorage.removeItem(NK);return}try{await loadName(n)}catch(e){msg('读取失败：'+e.message)}};
$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);renderCal()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);renderCal()};$('save').onclick=()=>saveCloud(false);$('submit').onclick=submit;$('edit').onclick=async()=>{if(!currentName)return msg('请先选择姓名');if(!(await ensureEditAuth()))return;editMode=!editMode;render()};$('passOk').onclick=()=>passDone(true);$('passCancel').onclick=()=>passDone(false);$('passInput').onkeydown=e=>{if(e.key==='Enter')passDone(true)};$('noteSave').onclick=saveMonthNote;$('noteCancel').onclick=closeNote;
(async function(){try{await loadAll();let n=getSavedName();if(n&&NAMES.includes(n))await loadName(n);else render()}catch(e){msg('读取云端失败：'+e.message);render();switchMainTab('stats')}})();
</script>
