.stat-card .sc-v{font-size:28px;font-weight:700;margin-top:4px}.stat-card .sc-l{font-size:12px;color:var(--gray)}.stat-card .sc-q{font-size:11px;color:var(--green);margin-top:2px}.stat-card .sc-q.down{color:var(--red)}
.empty{text-align:center;padding:80px 20px;color:#9ca3af;font-size:14px}
.section-card{background:var(--white);border-radius:14px;padding:0}.section-card .sc-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:14px;cursor:pointer}.section-card .sc-row:not(:last-child){border-bottom:1px solid #f3f4f6}.section-card .sc-row .arrow{color:#d1d5db;font-size:16px}
input[type=checkbox]{accent-color:var(--c1);width:18px;height:18px}
select{padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--white);width:100%}
textarea{border:1px solid var(--border);border-radius:10px;font-size:14px;padding:10px;width:100%;resize:none;outline:none}textarea:focus{border-color:var(--c1)}
.btn-full{width:100%;height:44px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;margin-top:12px}
.btn-primary-full{background:var(--c1);color:#fff}.btn-gray-full{background:#e5e7eb;color:var(--gray);margin-top:8px}
.mention{padding:10px 16px;background:var(--c1l);border-radius:0;text-align:center;cursor:pointer;font-size:13px;color:var(--c1);font-weight:500}
.mention.danger{background:#FEF2F2;color:var(--red)}
.detail-t{font-weight:600;font-size:15px}.detail-s{font-size:12px;color:var(--gray);margin-top:2px}
.s-fields{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--gray)}

</style>
</head><body>
<div id="pageList" class="page on"><div class="header"><div class="top-tabs"><button onclick="mainTab='mine';render()" id="tabMine" class="top-tab sel">我的线索</button><button onclick="mainTab='pool';render()" id="tabPool" class="top-tab">线索公海</button></div><div class="sub-tabs"><button onclick="subFilter='all';render()" id="stAll" class="sub-tab sel">全部<span id="cAll" class="ml-1"></span></button><button onclick="subFilter='nofollow';render()" id="stNf" class="sub-tab">未跟进<span id="cNf" class="ml-1"></span></button><button onclick="subFilter='nomark';render()" id="stNm" class="sub-tab">跟进后未打标<span id="cNm" class="ml-1"></span></button></div><div class="toolbar"><input id="searchInput" placeholder="搜索姓名/手机号/线索ID" oninput="onSearch()"><button class="tool-btn" id="encBtn" onclick="encrypted=!encrypted;render();updateEncBtn()">🔒</button><button class="tool-btn" onclick="openFilter()">筛选</button><button class="tool-btn" id="batchBtn" onclick="toggleBatch()">批量</button></div></div><div id="listContainer" class="list"></div></div>

<div class="navbar"><button onclick="switchPage('pageList')" id="navList" class="nav-item cur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>线索管理</button><button onclick="switchPage('pageData')" id="navData" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>数据概览</button><button onclick="switchPage('pageMe')" id="navMe" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 10-16 0"/></svg>我的</button></div>

<script>
var SUPABASE_URL='https://iduevkncajhkomeddeth.supabase.co',SUPABASE_KEY='sb_publishable_7APvWkNtTpyG_1T9owYgBw_nNVh466j'
var db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
var USER='admin001',ROLE='advertiser'
var mainTab='mine',subFilter='all',searchQ='',encrypted=true,batchMode=false
var selected=new Set(),clueCache=[],tagCache=[],staffCache=[],timer=null
var detailTab='info',detailClue=null,detailFollows=[],detailRemarks=[],detailLogs=[],trendChart=null
var STAGES=['new','called','following','phone_connected','wechat_added','chatting','high_intent','visited','deposit','deal','no_intent']
var STG={new:'待联系',called:'已拨打',following:'待持续跟进',phone_connected:'电话已建联',wechat_added:'微信加粉',chatting:'用户开口聊天',high_intent:'高意向',visited:'到店',deposit:'交定金',deal:'成交',no_intent:'无意向'}
var NOF=['new'],NOM=STAGES.filter(function(s){return s!=='new'&&s!=='no_intent'}),TYPES={form:'表单',chat:'私信',phone:'电话'},TRAFFIC={live:'直播',video:'视频'}
var CALL_MAP={connected:'接通',no_answer:'未接',busy:'忙线',wrong_number:'空号'}

<script>
function switchPage(p){
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('on')});
  document.getElementById(p).classList.add('on');
  document.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('cur')});
  if(p==='pageList'){document.getElementById('navList').classList.add('cur');render()}
  if(p==='pageData'){document.getElementById('navData').classList.add('cur');loadData()}
  if(p==='pageMe'){document.getElementById('navMe').classList.add('cur');loadMe()}
}
function updateEncBtn(){document.getElementById('encBtn').textContent=encrypted?'\uD83D\uDD12':'\uD83D\uDC41'}
function mp(p){if(!p)return'无';return encrypted?p.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'):p}
function mn(n){if(!n)return'未命名';return encrypted?n[0]+'**':n}
function ft(t){if(!t)return'-';var d=new Date(t),n=new Date(),ms=n-d;if(ms<6e4)return'刚刚';if(ms<36e5)return Math.floor(ms/6e4)+'分钟前';if(ms<864e5)return Math.floor(ms/36e5)+'小时前';if(ms<1728e5)return'昨天';return(d.getMonth()+1)+'/'+d.getDate()}
function onSearch(){clearTimeout(timer);timer=setTimeout(function(){searchQ=document.getElementById('searchInput').value.trim();render()},300)}
function toggleBatch(){batchMode=!batchMode;selected.clear();document.getElementById('batchBtn').classList.toggle('on',batchMode);var b=document.getElementById('batchBar');if(batchMode)b.classList.add('show');else b.classList.remove('show');updateBatchCount();render()}
function toggleSelect(id){if(selected.has(id))selected.delete(id);else selected.add(id);updateBatchCount();render()}
function updateBatchCount(){document.getElementById('batchCount').textContent='已选'+selected.size+'条'}
async function loadPrefs(){
  var a=await db.from('clue_tags').select('*').order('sort_order');
  var b=await db.from('staff').select('id,name').eq('is_active',true);
  tagCache=a.data||[];staffCache=b.data||[]
}
loadPrefs()
</script>
<script>
async function render(){
  var q=db.from('clues').select('*').order('created_at',{ascending:false}).limit(200);
  if(mainTab==='mine')q=q.not('assigned_to','is',null);
  if(mainTab==='pool')q=q.is('assigned_to',null);
  if(subFilter==='nofollow')q=q.in('status',NOF);
  if(subFilter==='nomark')q=q.in('status',NOM).eq('is_marked',false);
  if(searchQ)q=q.or('name.ilike.%'+searchQ+'%,phone.ilike.%'+searchQ+'%,clue_id.ilike.%'+searchQ+'%');
  var data=await q;clueCache=data.data||[];var d=clueCache;
  document.getElementById('cAll').textContent=d.length;
  document.getElementById('cNf').textContent=d.filter(function(c){return NOF.indexOf(c.status)>=0}).length;
  document.getElementById('cNm').textContent=d.filter(function(c){return NOM.indexOf(c.status)>=0&&!c.is_marked}).length;
  document.getElementById('tabMine').className='top-tab'+(mainTab==='mine'?' sel':'');
  document.getElementById('tabPool').className='top-tab'+(mainTab==='pool'?' sel':'');
  var tabs=document.querySelectorAll('.sub-tab');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('sel');
  if(subFilter==='all')document.getElementById('stAll').classList.add('sel');
  else if(subFilter==='nofollow')document.getElementById('stNf').classList.add('sel');
  else if(subFilter==='nomark')document.getElementById('stNm').classList.add('sel');
  var c=document.getElementById('listContainer');
  if(!d.length){c.innerHTML='<div class="empty">暂无线索</div>';return}
  var isMine=mainTab==='mine',parts=[];
  for(var i=0;i<d.length;i++){
    var cl=d[i],tg=[],tagHtml='',j,t,cid=cl.id,stg=STG[cl.status]||cl.status;
    for(j=0;j<(cl.tag_ids||[]).length;j++){var tid=cl.tag_ids[j];for(var k=0;k<tagCache.length;k++){if(tagCache[k].id===tid){tg.push(tagCache[k]);break}}}
    for(j=0;j<tg.length;j++){tagHtml+='<span class="card-tag" style="background:'+tg[j].color+'18;color:'+tg[j].color+'">'+tg[j].name+'</span>'}
    var selClass=selected.has(cid)?' sel':'',onlineDot=cl.is_online?'<span class="online-dot"></span>':'',ct=TYPES[cl.clue_type]||cl.clue_type||'',nm=mn(cl.name),ph=mp(cl.phone);
    var btns=isMine?'<button class="card-act" onclick="event.stopPropagation();sheetStatus(\''+cid+'\')">改进度</button><button class="card-act" onclick="event.stopPropagation();sheetTag(\''+cid+'\')">打标签</button><button class="card-act call" onclick="event.stopPropagation();dial(\''+cl.phone+'\')">\uD83D\uDCDE</button><button class="card-act danger" onclick="event.stopPropagation();abandon(\''+cid+'\')">放弃</button>':'<button class="card-act primary" onclick="event.stopPropagation();doClaim(\''+cid+'\')">认领</button><button class="card-act primary" onclick="event.stopPropagation();sheetAssign(\''+cid+'\')">分配</button>';
    var rawName=cl.name||'',escapedName=rawName.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    parts.push('<div class="card batch'+selClass+'" onclick="'+(batchMode?'toggleSelect(\''+cid+'\')':'openDetail(\''+cid+'\')')+'">'+
      (batchMode?'<input type="checkbox" class="cb" '+(selected.has(cid)?'checked':'')+' onchange="event.stopPropagation();toggleSelect(\''+cid+'\')">':'')+
      '<div class="row1"><div class="avatar">'+rawName.slice(0,1)+onlineDot+'</div><div class="info"><div class="name">'+nm+' <span class="status-pill" style="background:#f3f4f6;color:#6b7280">'+stg+'</span></div><div class="phone">'+ph+'</div><div class="meta"><span>'+ft(cl.created_at)+'</span>'+(ct?'<span>'+ct+'</span>':'')+'</div>'+(tagHtml?'<div class="tags">'+tagHtml+'</div>':'')+'</div></div><div class="actions">'+btns+'</div></div>')
  }
  c.innerHTML=parts.join('')
}
</script>
<script>
async function doClaim(id){await db.from('clues').update({assigned_to:USER,claimed_at:new Date().toISOString()}).eq('id',id);await db.from('operation_logs').insert({clue_id:id,action:'claim',detail:'认领线索',operator:USER,operator_role:ROLE});render()}
async function abandon(id){if(!confirm('确认放弃该线索？'))return;await db.from('clues').update({assigned_to:null,claimed_at:null,assigned_at:null}).eq('id',id);await db.from('operation_logs').insert({clue_id:id,action:'abandon',detail:'放弃回公海',operator:USER,operator_role:ROLE});render()}
async function doStatus(id,status){await db.from('clues').update({status:status}).eq('id',id);await db.from('operation_logs').insert({clue_id:id,action:'status_change',detail:'进度\u2192'+STG[status],operator:USER,operator_role:ROLE});closeSheet();render()}
async function addRemark(id){var el=document.getElementById('remarkInput');if(!el)return;var t=el.value.trim();if(!t)return;await db.from('remarks').insert({clue_id:id,content:t,created_by:USER});await db.from('operation_logs').insert({clue_id:id,action:'remark',detail:'添加备注',operator:USER,operator_role:ROLE});el.value='';openDetail(id)}

async function toggleTag(cid,tid,el){

<script>
async function openDetail(id){
  var r1=db.from('clues').select('*').eq('id',id).single();
  var r2=db.from('follow_ups').select('*').eq('clue_id',id).order('created_at',{ascending:false}).limit(100);
  var r3=db.from('remarks').select('*').eq('clue_id',id).order('created_at',{ascending:false}).limit(100);
  var r4=db.from('operation_logs').select('*').eq('clue_id',id).order('created_at',{ascending:false}).limit(100);
  var results=await Promise.all([r1,r2,r3,r4]);
  detailClue=results[0].data;detailFollows=results[1].data||[];detailRemarks=results[2].data||[];detailLogs=results[3].data||[];detailTab='info';
  document.getElementById('detailOverlay').classList.add('show');renderDetail()
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('show');render()}
function setDetailTab(t){detailTab=t;renderDetail()}
function renderDetail(){
  var c=detailClue;if(!c){document.getElementById('detailContent').innerHTML='';return}
  var calls=detailFollows.filter(function(f){return f.type==='call'});
  var conn=calls.filter(function(f){return f.call_result==='connected'}).length;
  var nconn=calls.filter(function(f){return f.call_result&&f.call_result!=='connected'}).length;
  var tags=[];for(var i=0;i<(c.tag_ids||[]).length;i++){for(var j=0;j<tagCache.length;j++){if(tagCache[j].id===c.tag_ids[i]){tags.push(tagCache[j]);break}}}
  var tagHtml=tags.length?tags.map(function(t){return'<span class="card-tag" style="background:'+t.color+'18;color:'+t.color+';padding:3px 8px;font-size:11px">'+t.name+'</span>'}).join(''):'<span style="font-size:11px;color:#9ca3af">暂无标签</span>';
  var curIdx=STAGES.indexOf(c.status);
  var stagesHtml='';for(var i=0;i<STAGES.length;i++){stagesHtml+='<button class="stage-pill'+(STAGES[i]===c.status?' cur':'')+(i<curIdx?' past':'')+'" onclick="doStatus(\''+c.id+'\',\''+STAGES[i]+'\');closeDetail();setTimeout(function(){openDetail(\''+c.id+'\')},200)">'+STG[STAGES[i]]+'</button>'}
  document.getElementById('detailContent').innerHTML=
  '<div class="detail-header"><span class="back" onclick="closeDetail()">\u2190</span><span style="font-weight:700;font-size:15px;flex:1">线索详情</span><span class="mention danger" style="padding:4px 10px;font-size:11px;border-radius:8px;cursor:pointer" onclick="doStatus(\''+c.id+'\',\'no_intent\');closeDetail();render()">标为无意向</span></div>'+
  '<div class="detail-scroll"><div class="detail-section"><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="width:44px;height:44px;font-size:18px">'+(c.name||'?').slice(0,1)+(c.is_online?'<span class="online-dot"></span>':'')+'</div><div style="flex:1"><div class="detail-t">'+mn(c.name)+' <span style="font-size:11px;background:#f3f4f6;padding:1px 6px;border-radius:4px;vertical-align:middle">'+STG[c.status]+'</span></div><div class="detail-s">'+mp(c.phone)+' \u00B7 '+ft(c.created_at)+'</div></div></div><div class="s-fields"><span>最近联系: '+(c.last_contact_at?ft(c.last_contact_at):'暂无')+'</span><span>通话: 接通'+conn+'次 未接通'+nconn+'次</span></div></div>'+
  '<div class="detail-section"><div class="s-title">线索阶段</div><div class="stages">'+stagesHtml+'</div><div class="s-title" style="margin-top:10px">标签</div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+tagHtml+'<button class="card-act primary" onclick="sheetTag(\''+c.id+'\')">+添加</button></div></div>'+
  '<div class="detail-tabs"><button onclick="setDetailTab(\'info\')" id="dtInfo" class="detail-tab'+(detailTab==='info'?' sel':'')+'">线索信息</button><button onclick="setDetailTab(\'calls\')" id="dtCalls" class="detail-tab'+(detailTab==='calls'?' sel':'')+'">通话记录</button><button onclick="setDetailTab(\'remarks\')" id="dtRemarks" class="detail-tab'+(detailTab==='remarks'?' sel':'')+'">备注</button><button onclick="setDetailTab(\'logs\')" id="dtLogs" class="detail-tab'+(detailTab==='logs'?' sel':'')+'">操作日志</button></div>'+
  '<div id="dtcContainer">'+(detailTab==='info'?renderInfo():detailTab==='calls'?renderCalls():detailTab==='remarks'?renderRemarks():renderLogs())+'</div><div style="height:60px"></div></div>'+
  '<div class="detail-actions"><button class="btn-primary" onclick="sheetStatus(\''+c.id+'\')">改进度</button><button class="btn-primary" style="background:#6366f1" onclick="sheetTag(\''+c.id+'\')">打标签</button><button class="btn-call" onclick="dial(\''+c.phone+'\')">\uD83D\uDCDE 拨打</button></div>'
}
function renderInfo(){
  var c=detailClue,rows=[],h='',i;
  rows.push(['姓名',c.name||'-']);rows.push(['电话','<a href="tel:'+c.phone+'" class="link">'+(encrypted?mp(c.phone):c.phone)+'</a>']);

  h+='</div>';return h

function renderCalls(){
  var calls=detailFollows.filter(function(f){return f.type==='call'}),h='<div class="detail-section">';
  if(!calls.length){h+='<div class="empty" style="padding:40px">暂无通话记录</div>'}
  else{for(var i=0;i<calls.length;i++){var f=calls[i],r=CALL_MAP[f.call_result]||f.call_result;h+='<div class="follow-item"><div style="display:flex;gap:8px;margin-bottom:2px"><span style="color:#6b7280">'+ft(f.created_at)+'</span><span style="padding:1px 6px;background:#f3f4f6;border-radius:4px;font-size:11px">'+r+'</span></div>'+(f.content?'<div style="font-size:12px">'+f.content+'</div>':'')+'</div>'}}

}
function renderRemarks(){
  var h='<div class="detail-section">';
  if(!detailRemarks.length){h+='<div class="empty" style="padding:40px">暂无备注</div>'}
  else{for(var i=0;i<detailRemarks.length;i++){var r=detailRemarks[i];h+='<div class="follow-item" style="border-left:'+(r.is_important?'2px solid #EF4444':'')+';padding-left:'+(r.is_important?'8px':'0')+'"><div style="font-size:11px;color:#6b7280;margin-bottom:2px">'+ft(r.created_at)+'</div><div>'+r.content+'</div></div>'}}
  h+='<div style="display:flex;gap:8px;margin-top:10px"><input id="remarkInput" placeholder="添加备注..." style="flex:1;height:38px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px;font-size:13px"><button onclick="addRemark(\''+detailClue.id+'\')" style="padding:0 16px;background:#4F46E5;color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer">添加</button></div></div>';return h

function renderLogs(){
  var h='<div class="detail-section">';
  if(!detailLogs.length){h+='<div class="empty" style="padding:40px">暂无操作日志</div>'}
  else{for(var i=0;i<detailLogs.length;i++){var l=detailLogs[i];h+='<div class="log-item"><span class="time">'+ft(l.created_at)+'</span><span class="act">'+(ACT_MAP[l.action]||l.action)+'</span><span style="flex:1">'+(l.detail||'')+'</span><span style="color:#d1d5db;font-size:10px">'+l.operator+'</span></div>'}}

async function addCall(id){
  sheetOpen('<div class="sh-title">添加通话记录</div><div style="margin-bottom:10px"><div style="font-size:12px;color:#6b7280;margin-bottom:4px">通话结果</div><select id="callResultSolid"><option value="connected">接通</option><option value="no_answer">未接</option><option value="busy">忙线</option><option value="wrong_number">空号</option></select></div><div style="margin-bottom:10px"><div style="font-size:12px;color:#6b7280;margin-bottom:4px">备注</div><textarea id="callNoteSolid" rows="2" placeholder="通话备注..."></textarea></div><button class="btn-full btn-primary-full" onclick="saveCall(\''+id+'\')">保存</button>')

<script>
async function loadData(){
  var s=document.getElementById('dataContent');
  try{var result=await db.from('clues').select('created_at,traffic_type').order('created_at',{ascending:false}).limit(10000);
    var all=result.data||[],n=new Date(),halfY=all.length;
    var y0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),y1=new Date(y0-864e5);
    var yest=all.filter(function(r){var d=new Date(r.created_at);return d>=y1&&d<y0}).length;
    var d7cut=new Date(n-7*864e5),d30cut=new Date(n-30*864e5),d14cut=new Date(n-14*864e5),d60cut=new Date(n-60*864e5);
    var d7=all.filter(function(r){return new Date(r.created_at)>=d7cut}).length;
    var d30=all.filter(function(r){return new Date(r.created_at)>=d30cut}).length;
    var p7=all.filter(function(r){var d=new Date(r.created_at);return d>=d14cut&&d<d7cut}).length;
    var p30=all.filter(function(r){var d=new Date(r.created_at);return d>=d60cut&&d<d30cut}).length;
    var q7=p7?((d7-p7)/p7*100).toFixed(1):'-',q30=p30?((d30-p30)/p30*100).toFixed(1):'-';
    var days=[];for(var i=29;i>=0;i--)days.push(new Date(n-i*864e5).toISOString().slice(0,10));
    var dm={};for(var i=0;i<all.length;i++){var k=all[i].created_at.slice(0,10);dm[k]=(dm[k]||0)+1}
    s.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="sc-l">近半年线索量</div><div class="sc-v">'+halfY+'</div></div><div class="stat-card"><div class="sc-l">昨日线索量</div><div class="sc-v">'+yest+'</div></div><div class="stat-card"><div class="sc-l">近7日线索量</div><div class="sc-v">'+d7+'</div><div class="sc-q'+(Number(q7)<0?' down':'')+'">环比 '+(q7>0?'+'+q7:q7)+'%</div></div><div class="stat-card"><div class="sc-l">近30日线索量</div><div class="sc-v">'+d30+'</div><div class="sc-q'+(Number(q30)<0?' down':'')+'">环比 '+(q30>0?'+'+q30:q30)+'%</div></div></div><div class="stat-card" style="padding:16px;margin-bottom:0"><div style="font-size:13px;font-weight:600;margin-bottom:8px">线索趋势 (近30天)</div><canvas id="trendChart" style="width:100%;height:200px"></canvas></div>';
    setTimeout(function(){
      var ctx=document.getElementById('trendChart');if(!ctx)return;ctx=ctx.getContext('2d');if(!ctx)return;
      if(trendChart)trendChart.destroy();
      trendChart=new Chart(ctx,{type:'line',data:{labels:days.map(function(d){return d.slice(5)}),datasets:[{label:'线索量',data:days.map(function(d){return dm[d]||0}),borderColor:'#4F46E5',backgroundColor:'rgba(79,70,229,0.08)',fill:true,tension:0.35,pointRadius:0,pointHoverRadius:4,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1f2937'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}})
    },200)
  }catch(e){s.innerHTML='<div class="empty">加载失败</div>'}
}
async function loadMe(){
  var r=await db.from('staff').select('*').eq('id',USER).single();
  var st=r.data||{name:'用户',id:USER,role:ROLE,phone:''},roles={admin:'管理员',manager:'经理',sales:'客服'};
  document.getElementById('meContent').innerHTML=
  '<div class="detail-section" style="margin-bottom:0"><div style="display:flex;align-items:center;gap:12px"><div class="avatar" style="width:52px;height:52px;font-size:20px">'+(st.name||'?').slice(0,1)+'</div><div style="flex:1"><div style="font-weight:700;font-size:16px">'+st.name+'</div><div style="font-size:12px;color:#6b7280">账户ID: '+st.id+'</div><div style="font-size:11px;color:#6b7280;margin-top:2px">角色: '+(roles[st.role]||st.role)+' · '+(st.phone||'未设置号码')+'</div></div></div></div>'+
  '<div class="section-card" style="margin:12px 0"><div class="sc-row" onclick="sheetTagManage()"><span>线索标签</span><span class="arrow">\u203A</span></div><div class="sc-row" onclick="sheetDedup()"><span>线索去重</span><span class="arrow">\u203A</span></div><div class="sc-row" onclick="sheetRemind()"><span>线索提醒</span><span class="arrow">\u203A</span></div><div class="sc-row" onclick="sheetAssignRule()"><span>分配规则 (轮询)</span><span class="arrow">\u203A</span></div></div>'+
  '<div class="section-card"><div class="sc-row" onclick="sheetPhone()"><span>本机号码</span><span style="color:#6b7280;font-size:12px">'+(st.phone||'未设置')+' \u203A</span></div><div class="sc-row"><span>部门</span><span style="color:#6b7280;font-size:12px">-</span></div></div>'
}
async function sheetTagManage(){
  await loadPrefs();var g={};for(var i=0;i<tagCache.length;i++){var t=tagCache[i];if(!g[t.group_id])g[t.group_id]=[];g[t.group_id].push(t)}
  var keys=Object.keys(g),h='<div class="sh-title">标签管理</div>';
  for(var ki=0;ki<keys.length;ki++){
    var gid=keys[ki],tags=g[gid],gn='';for(var i=0;i<tagCache.length;i++){if(tagCache[i].group_id===gid){gn=tagCache[i].group_name||gid.slice(0,8);break}}
    h+='<div style="background:#f9fafb;border-radius:12px;padding:12px;margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-weight:600;font-size:14px">'+gn+'</span><span style="font-size:12px;color:#4F46E5;cursor:pointer" onclick="addTagToGroup(\''+gid+'\')">+标签</span></div><div style="display:flex;flex-wrap:wrap;gap:4px">';
    for(var i=0;i<tags.length;i++){h+='<span class="card-tag" style="background:'+tags[i].color+'18;color:'+tags[i].color+';padding:4px 10px;font-size:12px;border-radius:6px">'+tags[i].name+'</span>'}
    h+=(tags.length?'':'<span style="font-size:11px;color:#6b7280">暂无标签</span>')+'</div></div>'
  }
  h+='<button class="btn-full btn-primary-full" onclick="createTagGroup()">+ 新建标签组</button><button class="btn-full btn-gray-full" onclick="closeSheet()">关闭</button>';sheetOpen(h)
}
async function createTagGroup(){var name=prompt('标签组名称:');if(!name)return;await db.from('tag_groups').insert({name:name,owner_id:USER});closeSheet();sheetTagManage()}
async function addTagToGroup(gid){var name=prompt('标签名称:');if(!name)return;var colors=['#EF4444','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899'];var color=colors[Math.floor(Math.random()*colors.length)];await db.from('clue_tags').insert({group_id:gid,name:name,color:color,owner_id:USER});closeSheet();sheetTagManage()}
async function sheetDedup(){
  var r=await db.from('dedup_settings').select('*').eq('owner_id',USER).single();
  var d=r.data||{is_active:true,dedup_by:'phone',dedup_window_days:30};
  sheetOpen('<div class="sh-title">线索去重</div><label style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="dedupActive" '+(d.is_active?'checked':'')+'><span style="font-size:14px">启用去重</span></label><div style="margin-bottom:12px"><div style="font-size:12px;color:#6b7280;margin-bottom:4px">去重时间窗口（天）</div><input id="dedupDays" type="number" value="'+d.dedup_window_days+'" style="width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;font-size:14px"></div><button class="btn-full btn-primary-full" onclick="saveDedup()">保存</button>')
}
async function saveDedup(){var a=document.getElementById('dedupActive').checked,w=parseInt(document.getElementById('dedupDays').value)||30;await db.from('dedup_settings').upsert({owner_id:USER,is_active:a,dedup_by:'phone',dedup_window_days:w},{onConflict:'owner_id'});closeSheet()}
async function sheetRemind(){
  var r=await db.from('reminder_settings').select('*').eq('owner_id',USER).single();
  var d=r.data||{is_active:true,no_follow_hours:24};
  sheetOpen('<div class="sh-title">线索提醒</div><label style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="remActive" '+(d.is_active?'checked':'')+'><span style="font-size:14px">启用提醒</span></label><div style="margin-bottom:12px"><div style="font-size:12px;color:#6b7280;margin-bottom:4px">超过N小时未跟进时提醒</div><input id="remHours" type="number" value="'+d.no_follow_hours+'" style="width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;font-size:14px"></div><button class="btn-full btn-primary-full" onclick="saveRemind()">保存</button>')
}
async function saveRemind(){var a=document.getElementById('remActive').checked,h=parseInt(document.getElementById('remHours').value)||24;await db.from('reminder_settings').upsert({owner_id:USER,is_active:a,no_follow_hours:h},{onConflict:'owner_id'});closeSheet()}
async function sheetAssignRule(){
  var r=await db.from('assignment_rules').select('*').eq('owner_id',USER).single();
  var rule=r.data||{is_active:true,staff_ids:[]},chk={};
  for(var i=0;i<(rule.staff_ids||[]).length;i++)chk[rule.staff_ids[i]]=true;
  var s='';for(var i=0;i<staffCache.length;i++){s+='<label style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f3f4f6"><input type="checkbox" class="arStaff" value="'+staffCache[i].id+'" '+(chk[staffCache[i].id]?'checked':'')+'><span style="font-size:14px">'+staffCache[i].name+'</span><span style="font-size:11px;color:#6b7280">'+staffCache[i].id+'</span></label>'}
  sheetOpen('<div class="sh-title">分配规则 (轮询分配)</div><label style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="arActive" '+(rule.is_active?'checked':'')+'><span style="font-size:14px">启用自动分配</span></label><div style="font-size:12px;color:#6b7280;margin-bottom:6px">参与轮询的客服 (顺序即分配顺序)</div><div style="max-height:240px;overflow-y:auto;margin-bottom:12px">'+s+'</div><button class="btn-full btn-primary-full" onclick="saveAssignRule()">保存</button>')
}
async function saveAssignRule(){var a=document.getElementById('arActive').checked,ids=[],els=document.querySelectorAll('.arStaff:checked');for(var i=0;i<els.length;i++)ids.push(els[i].value);await db.from('assignment_rules').upsert({owner_id:USER,is_active:a,staff_ids:ids,mode:'round_robin'},{onConflict:'owner_id'});closeSheet()}
function sheetPhone(){var stEl=document.querySelector('#meContent .sc-row span');var curPhone=staffCache[0]?staffCache[0].phone||'':'';sheetOpen('<div class="sh-title">本机号码</div><input id="phoneInput" type="tel" value="'+curPhone+'" style="width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px"><button class="btn-full btn-primary-full" onclick="savePhone()">保存</button>')}
async function savePhone(){var p=document.getElementById('phoneInput').value.trim();await db.from('staff').update({phone:p}).eq('id',USER);closeSheet();loadMe()}
render();loadPrefs()
</script>
