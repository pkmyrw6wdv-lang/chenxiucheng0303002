<main class="app"><header class="hero"><div class="hero-row"><h1>值班登记表</h1><div class="settings-wrap" id="settingsWrap"><button class="settings-btn" id="settingsBtn">⚙ 设置</button><div class="settings-dropdown" id="settingsDrop"><button type="button" class="settings-item" id="cfgBtn">参数设置</button><button type="button" class="settings-item" id="memberBtn">人员管理</button></div></div></div></header>

<script>
const SUPABASE_URL='https://ltdyppfomthxiprfmxbq.supabase.co',SUPABASE_KEY='sb_publishable_XH7DOUhidJvnt3ELX1pkFg_r5py5EEw',TABLE='duty_records',NOTE_TABLE='duty_month_notes',CK_CFG='duty-cfg-v1',CK_MEM='duty-mem-v1',CK_CACHE='duty-cache-v1',CK_NAME='duty-name-v5',EDIT_PASS='33673472',EDIT_START='2026-08-10';
const $=id=>document.getElementById(id);
const DEFAULT_CFG={leave:4,baseSalary:4000,restD:150,overtime:150};let cfg=loadCfg();function loadCfg(){try{return Object.assign({},DEFAULT_CFG,JSON.parse(localStorage.getItem(CK_CFG)))}catch(e){return{...DEFAULT_CFG}}}function saveCfg(){localStorage.setItem(CK_CFG,JSON.stringify(cfg))}

function api(p){return SUPABASE_URL+'/rest/v1/'+p}function h(x){return Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},x||{})}async function req(p,opt){let r=await fetch(api(p),Object.assign({},opt||{},{headers:h((opt&&opt.headers)||{})}));let t=await r.text(),j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}if(!r.ok)throw new Error((j&&j.message)||t||'请求失败');return j}
async function loadAll(){let cached=loadCache();if(cached){allRows=cached.rows||[];monthNotes=cached.notes||[]}let[rows,notes]=await Promise.all([req(TABLE+'?select=name,dates,submitted,updated_at&order=name.asc'),req(NOTE_TABLE+'?select=month,note,updated_at&order=month.asc').catch(()=>[])]);allRows=rows;monthNotes=notes;invalidateCache();saveCache();return allRows}function loadCache(){try{return JSON.parse(localStorage.getItem(CK_CACHE))}catch(e){return null}}function saveCache(){try{localStorage.setItem(CK_CACHE,JSON.stringify({rows:allRows,notes:monthNotes,ts:Date.now()}))}catch(e){}}
let month=new Date(),sel=new Set(),allRows=[],monthNotes=[],submitted=false,currentName='',editMode=false,editAuthed=sessionStorage.getItem('duty-edit-auth')==='1',passResolve=null,baseline='',editingNoteMonth='',_om=null,_od=null;month.setDate(1);let statsView='month',statsMonth=new Date(),statsYear=new Date().getFullYear(),statsMonths=new Set();statsMonth.setDate(1);

function fromCloud(r){return{name:r.name,dates:r.dates||[],submitted:!!r.submitted,updatedAt:r.updated_at}}function rowOf(n){return allRows.find(r=>r.name===n)}function occupiedMap(){if(_om)return _om;let m={};allRows.forEach(r=>{(r.dates||[]).forEach(d=>{if(!m[d])m[d]=[];m[d].push(r.name)})});_om=m;return m}function otherDates(){if(_od&&_od._for===currentName)return _od;let s=new Set();allRows.forEach(r=>{if(r.name!==currentName)(r.dates||[]).forEach(d=>s.add(d))});s._for=currentName;_od=s;return s}function invalidateCache(){_om=null;_od=null}

function renderCal(){let c=$('cal'),y=month.getFullYear(),m=month.getMonth(),td=today(),od=otherDates(),om=occupiedMap();$('month').textContent=y+'年'+(m+1)+'月';let h='<div class="wk">日</div><div class="wk">一</div><div class="wk">二</div><div class="wk">三</div><div class="wk">四</div><div class="wk">五</div><div class="wk">六</div>';let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prefix='';for(let i=0;i<first;i++)prefix+='<button class="day blank" disabled></button>';let body='',base=y+'-'+pad(m+1)+'-';for(let d=1;d<=days;d++){let s=base+pad(d),mine=sel.has(s),other=od.has(s),past=s<td,owners=(om[s]||[]).map(labelOf).join('、'),ok=canClick(s,mine,other,past),cls='day'+(s===td?' today':'')+(mine?' sel':'')+(past?' past':'')+(other?' other':'')+(other?ownerClass(om[s]):'')+(mine&&!editMode?' mine-lock':'')+(!ok?' locked':'');body+=`<button type="button" class="${cls}"${ok?'':' disabled'} title="${owners?'预占：'+owners:(s<EDIT_START?'早于可编辑起点':'可选择')}" data-d="${s}"><span class="num">${d}</span><span class="owner">${owners||(s<EDIT_START?'不可改':past?(editMode?'可编辑':'历史'):'')}</span></button>`}c.innerHTML=h+prefix+body;c.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>toggle(b.dataset.d))}

function renderMonthStat(mon,rows){let y=+mon.slice(0,4),m=+mon.slice(5,7),daysInMonth=new Date(y,m,0).getDate(),currentMon=today().slice(0,7),todayDay=+today().slice(8,10),cutoff=mon<currentMon?daysInMonth:(mon===currentMon?todayDay:0),names=activeNames(),counts={},currentCounts={};names.forEach(n=>{counts[n]=countFor(rows,n,mon);currentCounts[n]=countForUntil(rows,n,mon,cutoff)});let total=names.reduce((a,n)=>a+(counts[n]||0),0),totalForRatio=total||1,offCode=officialCode(),admCode=adminCode(),pNames=payNames();let expected0=daysInMonth-cfg.leave,current0Days=currentCounts[offCode]||0,monthEndNon0Days=names.filter(n=>n!==offCode).reduce((a,n)=>a+(counts[n]||0),0),currentWage0=cfg.baseSalary+(current0Days-expected0)*cfg.restD,monthEndWage0=cfg.baseSalary+(cfg.leave*cfg.overtime)-monthEndNon0Days*cfg.restD;let adminDays=counts[admCode]||0,currentAdminDays=currentCounts[admCode]||0,pL=Math.max(pNames.length,1),adminShare=adminDays*cfg.overtime/pL,currentAdminShare=currentAdminDays*cfg.overtime/pL,base=cfg.baseSalary+(cfg.leave*cfg.overtime),currentBase=base*(cutoff/daysInMonth),maxPay=pNames.length?Math.ceil(base/pNames.length):0;let table0=`<table class="stat-table"><thead><tr><th>人员</th><th>天数</th><th>比例</th><th>当前工资</th><th>月底工资</th></tr></thead><tbody><tr><td>${labelOf(offCode)}</td><td>${counts[offCode]||0}</td><td>${ratio(counts[offCode]||0,totalForRatio)}</td><td class="money salary">${money(currentWage0)}</td><td class="money salary">${money(monthEndWage0)}</td></tr></tbody></table>`;let admin=`<tr><td>${labelOf(admCode)}</td><td>${adminDays}</td><td>${ratio(adminDays,totalForRatio)}</td><td>—</td><td>—</td></tr>`;let payRows=pNames.map(n=>{let cPay=-(currentBase-(currentCounts[n]||0)*cfg.overtime-currentAdminShare);let mPay=-(base-(counts[n]||0)*cfg.overtime-adminShare);return{name:n,count:counts[n]||0,currentPay:cPay,monthPay:mPay}}).sort((a,b)=>b.monthPay-a.monthPay);let payerRows=payRows.map(r=>`<tr><td>${labelOf(r.name)}</td><td>${r.count}</td><td>${ratio(r.count,totalForRatio)}</td><td class="money ${payClass(r.currentPay)}">${money(r.currentPay)}</td><td class="money ${payClass(r.monthPay)}">${money(r.monthPay)}</td></tr>`).join('');let note=getMonthNote(mon);return`<div class="month-stat"><div class="stat-head"><span>${y}年${m}月</span><small>截止到 ${today()}</small></div><div class="stat-subtitle">${labelOf(offCode)}正式员工工资（最大工资 ¥${base}）</div>${table0}<div class="stat-subtitle">${labelOf(admCode)} / ${pNames.map(labelOf).join('')}支付统计（最大支付 ¥${maxPay}）</div><table class="stat-table"><thead><tr><th>人员</th><th>天数</th><th>比例</th><th>当前需付</th><th>月底需付</th></tr></thead><tbody>${admin}${payerRows}</tbody></table><div class="month-note"><b>月度备注：</b>${note||'暂无'}<br><button class="note-btn" onclick="openNote('${mon}')">编辑本月备注</button></div><div class="stat-note">计算规则：当前工资 = ${cfg.baseSalary} + (当前已发生${labelOf(offCode)}值班天数 - (本月天数-${cfg.leave})) × ${cfg.restD}；月底工资 = ${base} - 本月已发生和已标记的非"${labelOf(offCode)}"日期数 × ${cfg.restD}。当前需付按至今天已发生日期计算；月底需付按本月已选择的全部日期估算。支付金额以支出为负数。${labelOf(admCode)}只展示天数和比例，不展示金额。</div></div>`}
function getMonthNote(mon){let r=monthNotes.find(x=>x.month===mon);return r&&r.note?r.note:''}async function openNote(mon){if(!(await ensureEditAuth()))return;editingNoteMonth=mon;$('noteTitle').textContent=mon+' 月度备注';$('monthNoteInput').value=getMonthNote(mon);$('noteModal').classList.add('show');setTimeout(()=>$('monthNoteInput').focus(),30)}function closeNote(){$('noteModal').classList.remove('show');editingNoteMonth=''}async function saveMonthNote(){if(!editingNoteMonth)return;let note=$('monthNoteInput').value.trim();try{await req(NOTE_TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({month:editingNoteMonth,note:note,updated_at:new Date().toISOString()})});await loadAll();closeNote();renderStats();msg('月度备注已保存')}catch(e){msg('备注保存失败：'+e.message)}}
function ratio(x,total){return total?((x/total)*100).toFixed(1)+'%':'0.0%'}function money(x){let sign=x<0?'-':x>0?'+':'';let v=Math.abs(x);return sign+'¥'+(Math.round(v*100)/100).toFixed(Number.isInteger(Math.round(v*100)/100)?0:2)}function payClass(x){let v=Math.abs(x);if(v===0)return'zero';if(v<300)return'pay-low';if(v<600)return'pay-default';if(v<900)return'pay-mid';return'pay-high'}function switchMainTab(which){let duty=which==='duty';$('tabDuty').classList.toggle('hidden-panel',!duty);$('tabStats').classList.toggle('hidden-panel',duty);$('tabDutyBtn').classList.toggle('active',duty);$('tabStatsBtn').classList.toggle('active',!duty);if(!duty)renderStatsView()}

function renderYearView(){
  let box=$('statsYearBox');if(!box)return;
  let rows=getStatsRows(),yr=statsYear;
  $('stYear').textContent=yr+'年';
  let dataMonths=new Set();
  rows.forEach(r=>(r.dates||[]).forEach(x=>{if(x.startsWith(yr+'-'))dataMonths.add(x.slice(0,7))}));
  dataMonths.add(today().slice(0,7));
  if(!statsMonths.size)[...dataMonths].filter(m=>m.startsWith(yr+'-')).forEach(m=>statsMonths.add(m));
  let mf=$('monthFilter'),btns='';
  for(let m=1;m<=12;m++){
    let key=yr+'-'+pad(m),hasData=dataMonths.has(key),on=statsMonths.has(key);
    btns+=`<button class="mf-btn ${on?'on':'off'}" data-m="${key}"${!hasData&&!on?' style="opacity:.45"':''}>${m}月</button>`;
  }
  mf.innerHTML=btns;
  mf.querySelectorAll('.mf-btn').forEach(b=>b.onclick=()=>{
    let m=b.dataset.m;if(statsMonths.has(m))statsMonths.delete(m);else statsMonths.add(m);renderYearView();
  });
  let selMons=[...statsMonths].filter(m=>m.startsWith(yr+'-')).sort();
  if(!selMons.length){box.innerHTML='<div class="hint" style="padding:12px">请选择至少一个月份</div>';return}
  let names=activeNames(),offCode=officialCode(),admCode=adminCode(),pNames=payNames();
  let monthData={};
  selMons.forEach(mon=>{
    let y2=+mon.slice(0,4),m2=+mon.slice(5,7),dim=new Date(y2,m2,0).getDate();
    let curMon=today().slice(0,7),td=+today().slice(8,10);
    let cutoff=mon<curMon?dim:(mon===curMon?td:0);
    let counts={},curCounts={};
    names.forEach(n=>{counts[n]=countFor(rows,n,mon);curCounts[n]=countForUntil(rows,n,mon,cutoff)});
    let exp=dim-cfg.leave,curOD=curCounts[offCode]||0;
    let nonOD=names.filter(n=>n!==offCode).reduce((a,n)=>a+(counts[n]||0),0);
    let curWOff=cfg.baseSalary+(curOD-exp)*cfg.restD;
    let endWOff=cfg.baseSalary+(cfg.leave*cfg.overtime)-nonOD*cfg.restD;
    let adD=counts[admCode]||0,cadD=curCounts[admCode]||0,pL=Math.max(pNames.length,1);
    let adS=adD*cfg.overtime/pL,cadS=cadD*cfg.overtime/pL;
    let base=cfg.baseSalary+(cfg.leave*cfg.overtime);
    let curB=base*(cutoff/dim);
    let pays=pNames.map(n=>({name:n,count:counts[n]||0,curCount:curCounts[n]||0,
      cPay:-(curB-(curCounts[n]||0)*cfg.overtime-cadS),
      mPay:-(base-(counts[n]||0)*cfg.overtime-adS)}));
    monthData[mon]={countsOff:counts[offCode]||0,curOD,curWOff,endWOff,adD,adS,pays,dim,
      total:names.reduce((a,n)=>a+(counts[n]||0),0)};
  });
  let aOD=0,aCOD=0,aCWO=0,aEWO=0,aAD=0,ap={};
  pNames.forEach(n=>ap[n]={count:0,curCount:0,cPay:0,mPay:0});
  Object.values(monthData).forEach(md=>{
    aOD+=md.countsOff;aCOD+=md.curOD;aCWO+=md.curWOff;aEWO+=md.endWOff;aAD+=md.adD;
    md.pays.forEach(p=>{ap[p.name].count+=p.count;ap[p.name].curCount+=p.curCount;
      ap[p.name].cPay+=p.cPay;ap[p.name].mPay+=p.mPay});
  });
  let aTot=aOD+aAD+pNames.reduce((a,n)=>a+ap[n].count,0),aTR=aTot||1;
  let offT=`<table class="stat-table"><thead><tr><th>人员</th><th>累计天数</th><th>比例</th><th>当前累计工资</th><th>预计年度工资</th></tr></thead><tbody><tr><td>${labelOf(offCode)}</td><td>${aOD}</td><td>${ratio(aOD,aTR)}</td><td class="money salary">${money(aCWO)}</td><td class="money salary">${money(aEWO)}</td></tr></tbody></table>`;
  let admR=`<tr><td>${labelOf(admCode)}</td><td>${aAD}</td><td>${ratio(aAD,aTR)}</td><td>—</td><td>—</td></tr>`;
  let payR=Object.entries(ap).sort((a,b)=>b[1].mPay-a[1].mPay).map(([n,p])=>`<tr><td>${labelOf(n)}</td><td>${p.count}</td><td>${ratio(p.count,aTR)}</td><td class="money ${payClass(p.cPay)}">${money(p.cPay)}</td><td class="money ${payClass(p.mPay)}">${money(p.mPay)}</td></tr>`).join('');
  let bk=selMons.map(mon=>{let md=monthData[mon];return`<tr><td>${+mon.slice(5,7)}月</td><td>${md.countsOff}</td><td class="money salary">${money(md.endWOff)}</td>${pNames.map(n=>{let p=md.pays.find(x=>x.name===n);return`<td class="money ${payClass(p?p.mPay:0)}">${money(p?p.mPay:0)}</td>`}).join('')}</tr>`}).join('');
  let hCells=pNames.map(n=>`<th>${labelOf(n)}</th>`).join('');
  let notes=selMons.map(mon=>{let nt=getMonthNote(mon);return nt?`<div class="month-note"><b>${+mon.slice(5,7)}月备注：</b>${nt}</div>`:''}).join('');
  box.innerHTML=`<div class="month-stat"><div class="stat-head"><span>${yr}年 年度汇总</span><small>已选 ${selMons.length} 个月</small></div><div class="stat-subtitle">${labelOf(offCode)}正式员工年度工资</div>${offT}<div class="stat-subtitle">支付方年度统计</div><table class="stat-table"><thead><tr><th>人员</th><th>天数</th><th>比例</th><th>当前需付</th><th>预计需付</th></tr></thead><tbody>${admR}${payR}</tbody></table></div><div class="month-stat" style="margin-top:12px"><div class="stat-head"><span>按月明细</span><small>行=月份, 列=人员</small></div><div style="overflow-x:auto"><table class="stat-table" style="min-width:auto"><thead><tr><th>月份</th><th>${labelOf(offCode)}</th><th>工资</th>${hCells}</tr></thead><tbody>${bk}</tbody></table></div></div>${notes}<div class="stat-note">年度汇总 = 所选月份月度数据之和。切换年份时月份筛选自动重置。</div>`;
}
